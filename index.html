function oatrHas(flag) { return state.flags.has(flag); }
function oatrChose(id, fragment) { return state.history.some(h => h.id === id && h.label && h.label.includes(fragment)); }

function oatrReignAccounting() {
  const s = state.scores;
  const parts = [];

  if (oatrHas('heardGapon') || oatrHas('gaponCompromise')) parts.push('In 1905 you taught the capital that petition could sometimes reach the Crown before rifle fire did.');
  else if (oatrHas('bloodySunday')) parts.push('In 1905 you allowed the first great petition of the reign to end in blood, and every later promise had to compete with the memory of snow around the Winter Palace.');

  if (oatrHas('dumaReal') || oatrHas('constitutionalCompact') || oatrHas('cabinetGovernment')) parts.push('You gave institutions outside your own person enough reality that ministers, deputies and courts learned to survive disagreement with the sovereign.');
  else if (s.autocracy >= 18) parts.push('You repeatedly chose personal command over institutional bargaining; ministries learned that the safest policy was the one nearest your will, or nearest what they guessed your will to be.');

  if (oatrHas('stolypinFullProgram') || oatrHas('stolypinBacked')) parts.push('You spent dynastic authority protecting Stolypin from the court, the landlords and your own instinct to retreat when reform became embarrassing.');
  else if (oatrHas('stolypinEconomicOnly') || oatrHas('stolypinNeutered')) parts.push('You accepted Stolypin’s railways, banks, tax base and productive farms while refusing much of the political settlement he believed those gains required.');
  else if (oatrHas('stolypinChecked')) parts.push('You let Stolypin become another clever servant whose usefulness ended where his program began to inconvenience the palace.');

  if (s.land >= 12) parts.push('Enough peasants acquired land, credit and a reason to fear chaos that the village ceased to be merely something administered from above.');
  else if (s.land <= 3) parts.push('The land question remained a promise written over millions of strips, communes and resentments; the village entered the future with very little reason to defend the order that governed it.');

  if (oatrHas('okhranaReformed')) parts.push('Political policing was forced back toward law: still intrusive, still Russian, but less able to manufacture the conspiracies it claimed to discover.');
  else if (s.blood >= 18) parts.push('You treated emergency coercion as a renewable resource. The police, governors and patriotic auxiliaries learned that violence committed for order would usually be forgiven after the paperwork was complete.');

  if (oatrHas('churchFree')) parts.push('You loosened the Petrine grip on the Church and allowed Orthodoxy to become less a department of state and more an institution capable of outliving one.');
  if (oatrHas('federalBlueprint') || oatrHas('federalPoland') || oatrHas('federalFinland')) parts.push('You accepted that loyalty did not have to mean sameness, and began turning old imperial bargains into actual federal law.');

  if (oatrHas('civilianArmy')) parts.push('You modernized the army without letting competence become a constitutional claim to rule.');
  else if (oatrHas('armyMachine') || oatrHas('armyAutonomy') || s.military >= 18) parts.push('You made the army one of the few institutions permitted to become fully modern, and it learned the dangerous lesson that competence was a form of political legitimacy.');

  if (oatrHas('germanAlliance')) parts.push('You broke Russia’s inherited alignment and tied continental strategy to Berlin, forcing every Balkan crisis to become a test of whether sentiment or strategy ruled Petersburg.');
  else if (oatrHas('ententeAligned') || oatrHas('frenchCommitment')) parts.push('You kept the French alliance real enough that loans, railway plans and military obligations eventually became one structure.');

  if (oatrHas('peace1914')) parts.push('At the last hour you accepted diplomatic humiliation, ambiguity or delay rather than turn mobilization into destiny.');
  if (oatrHas('war1914')) parts.push('At the last hour you chose war, and Russia entered it carrying every institutional virtue and every unresolved contradiction you had accumulated since 1905.');

  return parts;
}

/* Consequence continuity pass.

   This layer exists for one reason: a decision must be allowed to make later history stop looking
   historical.  If Nicholas saves Stolypin, Stolypin is not shot five minutes later because the
   calendar says 1911.  If Rasputin is expelled, he does not wander back into dialogue as though
   the flag were decorative.  If Russia spends years building a Berlin channel, the German embassy
   does not perform the untouched historical scene unless that relationship has actually collapsed.

   Loaded after the other branch/advisor modules so these are continuity rules of last resort. */

function oatrContinuityOverrideChoices(id, resolver) {
  const prior = OATR_BRANCHING.choiceOverrides[id];
  OATR_BRANCHING.choiceOverrides[id] = ctx => {
    const result = resolver(ctx, prior);
    if (result !== null && result !== undefined) return result;
    return typeof prior === 'function' ? prior(ctx) : prior;
  };
}

function oatrRasputinExiled(ctx) {
  return (ctx.flag('rasputinBanish') || ctx.flag('rasputinBanishFinal')) && !ctx.flag('rasputinRecalled');
}

function oatrGermanDetente(ctx) {
  return ['germanophile','willyNicky','berlinUnderstanding','continentalCompact','germanAlignment1914']
    .some(flag => ctx.flag(flag));
}

function oatrGermanChannelOpen(ctx) {
  if (!oatrGermanDetente(ctx)) return false;
  if (ctx.flag('war1914') || ctx.flag('warMachine')) return false;
  if (ctx.flag('secretSerbiaGuarantee') || ctx.flag('serbiaPatron1914')) return false;
  if (ctx.flag('generalMobilization') && !ctx.flag('mobilizationReversed')) return false;
  return true;
}

function oatrMarginaliaImage(entry) {
  return typeof entry.image === 'function' ? entry.image() : entry.image;
}

function oatrMarginaliaTermNode(text, entry) {
  const mark = document.createElement('span');
  mark.className = `marginalia-term marginalia-${entry.id}`;
  mark.tabIndex = 0;
  mark.setAttribute('role','note');
  mark.setAttribute('aria-label', `${text}. Nicholas private note: ${entry.note}`);

  const word = document.createElement('span');
  word.className = 'marginalia-word';
  word.textContent = text;
  mark.appendChild(word);

  const pencil = document.createElement('span');
  pencil.className = 'marginalia-pencil';
  pencil.textContent = '✎';
  pencil.setAttribute('aria-hidden','true');
  mark.appendChild(pencil);

  const tip = document.createElement('span');
  tip.className = 'marginalia-tooltip';
  tip.setAttribute('aria-hidden','true');
  const image = oatrMarginaliaImage(entry);
  if (image) {
    const img = document.createElement('img');
    img.src = image;
    img.alt = entry.caption || '';
    img.loading = 'lazy';
    tip.appendChild(img);
  }
  const copy = document.createElement('span');
  copy.className = 'marginalia-copy';
  copy.innerHTML = `<small>${entry.eyebrow}</small><strong>${entry.note}</strong>${entry.caption ? `<em>${entry.caption}</em>` : ''}`;
  tip.appendChild(copy);
  mark.appendChild(tip);
  return mark;
}

function oatrApplyMarginalia(root=document) {
  if (!root?.querySelectorAll || !document?.createTreeWalker || !document?.createElement) return;
  // Marginalia belongs in the dispatch prose, not in navigation/header copy. Keep the dateline,
  // chapter kicker and event title inert even when they contain a term with an available tooltip.
  const selectors = '.dispatch p, article > blockquote p';
  root.querySelectorAll(selectors).forEach(container => {
    const showText = typeof NodeFilter !== 'undefined' ? NodeFilter.SHOW_TEXT : 4;
    const walker = document.createTreeWalker(container, showText);
    const nodes = [];
    let node;
    while ((node = walker.nextNode())) {
      if (!node.parentElement?.closest?.('.marginalia-term') && node.nodeValue?.trim()) nodes.push(node);
    }

    nodes.forEach(textNode => {
      let segments = [{ text:textNode.nodeValue, entry:null }];
      OATR_MARGINALIA.forEach(entry => {
        entry.terms.forEach(term => {
          const next = [];
          segments.forEach(seg => {
            if (seg.entry) return next.push(seg);
            const pattern = new RegExp(`(${term.replace(/[.*+?^${}()|[\\]\\]/g,'\\<!-- INLINE_SCRIPT -->')})`, 'ig');
            let last = 0;
            let match;
            while ((match = pattern.exec(seg.text))) {
              if (match.index > last) next.push({text:seg.text.slice(last,match.index),entry:null});
              next.push({text:match[0],entry});
              last = match.index + match[0].length;
            }
            if (last < seg.text.length) next.push({text:seg.text.slice(last),entry:null});
          });
          segments = next.length ? next : segments;
        });
      });

      if (!segments.some(seg => seg.entry)) return;
      const frag = document.createDocumentFragment();
      segments.forEach(seg => frag.appendChild(seg.entry ? oatrMarginaliaTermNode(seg.text,seg.entry) : document.createTextNode(seg.text)));
      textNode.parentNode.replaceChild(frag,textNode);
    });
  });
}

if (typeof MutationObserver !== 'undefined' && document?.documentElement) {
  let marginaliaQueued = false;
  new MutationObserver(() => {
    if (marginaliaQueued) return;
    marginaliaQueued = true;
    Promise.resolve().then(() => {
      marginaliaQueued = false;
      oatrApplyMarginalia(document);
    });
  }).observe(document.documentElement,{subtree:true,childList:true});
}

if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
  window.addEventListener('DOMContentLoaded',()=>oatrApplyMarginalia(document));
}

// Process the opening question when this file is loaded after the initial render.
oatrApplyMarginalia(document);


/* Contextual marginalia pass.
   Tooltip notes should feel like Nicholas annotating the file in front of him, not a static glossary.
   Loaded after marginalia.js so it can temporarily retune note/eyebrow/caption text for the current question. */

const OATR_MARGINALIA_BASE_COPY = Object.fromEntries(
  OATR_MARGINALIA.map(entry => [entry.id, {
    eyebrow: entry.eyebrow,
    note: entry.note,
    caption: entry.caption
  }])
);

function oatrMarginaliaQuestionId() {
  try { return typeof currentQuestion === 'function' ? (currentQuestion()?.id || 0) : 0; }
  catch { return 0; }
}

function oatrMarginaliaHas(flag) {
  try { return state?.flags?.has?.(flag) || false; }
  catch { return false; }
}

function oatrMarginaliaScore(key) {
  try { return Number(state?.scores?.[key] || 0); }
  catch { return 0; }
}

function oatrMarginaliaPatch(id, patch) {
  const entry = OATR_MARGINALIA.find(item => item.id === id);
  if (!entry || !patch) return;
  Object.assign(entry, patch);
}

function oatrContextualizeMarginalia() {
  OATR_MARGINALIA.forEach(entry => {
    const base = OATR_MARGINALIA_BASE_COPY[entry.id];
    if (base) Object.assign(entry, base);
  });

  const qid = oatrMarginaliaQuestionId();

  if (qid >= 56) {
    oatrMarginaliaPatch('mobilization', {
      eyebrow:'THE RAILWAYS HAVE AN OPINION · N.A.R.',
      note: oatrMarginaliaHas('generalMobilization')
        ? 'It is no longer a precaution once the timetables begin moving men faster than diplomats can move words.'
        : 'Every general says it is only a precaution. Every foreign general owns the same timetable.',
      caption:'Russian mobilization planning in the July Crisis.'
    });
    oatrMarginaliaPatch('army', {
      eyebrow:'GENERAL STAFF · JULY 1914 · N.A.R.',
      note:'They have spent years preparing the perfect answer to a question diplomacy keeps changing.',
      caption:'The Imperial Russian Army and the machinery behind mobilization.'
    });
    oatrMarginaliaPatch('serbia', {
      eyebrow:'SERBIA · JULY 1914 · N.A.R.',
      note: oatrMarginaliaHas('serbiaAbandoned1914')
        ? 'We taught Belgrade that Russian affection is not an insurance policy. They have noticed.'
        : oatrMarginaliaHas('serbiaPatron1914') || oatrMarginaliaHas('blankChequeSerbia')
          ? 'A small kingdom with the remarkable ability to turn Russian sentiment into a continental obligation.'
          : 'Brother Slavs, inconveniently located at the exact point where sentiment becomes mobilization.',
      caption:'Serbia at the center of the July Crisis.'
    });
    oatrMarginaliaPatch('germany', {
      eyebrow:'BERLIN · JULY 1914 · N.A.R.',
      note: oatrMarginaliaHas('continentalCompact') || oatrMarginaliaHas('berlinUnderstanding')
        ? 'Willy may be exhausting. He is also offering a Europe in which Berlin and Petersburg do not have to discover who mobilizes faster.'
        : 'Willy. Exhausting. Dear Willy. Unfortunately his railway timetables are not sentimental.',
      caption:'Wilhelm II and the German decision at the center of the crisis.'
    });
  }

  if (qid >= 20) {
    oatrMarginaliaPatch('britain', {
      eyebrow:'THE ENTENTE · WITH CONDITIONS · N.A.R.',
      note:'We stopped competing over Persia by drawing lines through Persia. The British call this an understanding.',
      caption:'Punch on the Anglo-Russian understanding: the British Lion watches the Russian Bear sit on the Persian Cat’s tail, 1911.'
    });
  } else {
    oatrMarginaliaPatch('britain', {
      eyebrow:'THE OLD RIVAL · N.A.R.',
      note:'The sea is theirs, India is theirs, and somehow every railway we build south becomes a British security question.',
      caption:'British and Russian rivalry before the Anglo-Russian Convention.'
    });
  }

  if (qid >= 56 && (oatrMarginaliaHas('germanAlignment1914') || oatrMarginaliaHas('continentalCompact'))) {
    oatrMarginaliaPatch('britain', {
      eyebrow:'LONDON WATCHES · N.A.R.',
      note:'The British spent decades fearing Russia in Asia. Now they are wondering what it means if Russia stops fearing Germany in Europe.',
      caption:'The British strategic problem changes when Petersburg and Berlin begin speaking to one another.'
    });
  }

  if (oatrMarginaliaHas('dumaReal') || oatrMarginaliaHas('constitutionalCompact')) {
    oatrMarginaliaPatch('duma', {
      eyebrow:'A REAL INSTITUTION NOW · N.A.R.',
      note:'I gave it enough authority to become difficult. That may have been the point.',
      caption:'The State Duma after the Crown gives parliamentary procedure real political weight.'
    });
    oatrMarginaliaPatch('constitution', {
      eyebrow:'THE PROMISE HAS CONSEQUENCES · N.A.R.',
      note:'A law explaining what the sovereign may not do. More curious now that ministers have begun treating it as law.',
      caption:'The constitutional settlement after 1905.'
    });
  } else if (oatrMarginaliaHas('dumaBroken') || oatrMarginaliaHas('fundamentalLawsHard')) {
    oatrMarginaliaPatch('duma', {
      eyebrow:'THE DUMA · CONTAINED · N.A.R.',
      note:'It may speak. The difficulty begins whenever it assumes speaking should alter anything.',
      caption:'The State Duma under a Crown determined to keep parliamentary authority narrow.'
    });
  }

  if (oatrMarginaliaHas('stolypinBacked') || oatrMarginaliaHas('stolypinSecondWind')) {
    oatrMarginaliaPatch('stolypin', {
      eyebrow:'MY PRIME MINISTER · FOR NOW · N.A.R.',
      note:'He keeps asking me to spend autocratic power on building institutions that will need less autocratic power. Irritatingly coherent.',
      caption:'Pyotr Stolypin while the Crown is actively backing his reform program.'
    });
  } else if (oatrMarginaliaHas('stolypinChecked') || oatrMarginaliaHas('stolypinContained')) {
    oatrMarginaliaPatch('stolypin', {
      eyebrow:'TOO INDISPENSABLE · N.A.R.',
      note:'Useful men become dangerous when they begin to suspect usefulness is authority.',
      caption:'Pyotr Stolypin as court resistance closes around his program.'
    });
  } else if (oatrMarginaliaHas('stolypinDead')) {
    oatrMarginaliaPatch('stolypin', {
      eyebrow:'THE EMPTY CHAIR · N.A.R.',
      note:'The program remains. The man who could force everyone to discuss it does not.',
      caption:'Stolypin after the Kiev assassination.'
    });
  }

  if (oatrMarginaliaHas('rasputinTrusted')) {
    oatrMarginaliaPatch('rasputin', {
      eyebrow:'HE STAYS · N.A.R.',
      note:'They see a peasant in the palace. Alix sees the man who can make Alexei stop bleeding. I know which argument wins upstairs.',
      caption:'Rasputin after becoming indispensable inside the imperial family.'
    });
  } else if (oatrMarginaliaHas('rasputinLimited') || oatrMarginaliaHas('rasputinKeptOut')) {
    oatrMarginaliaPatch('rasputin', {
      eyebrow:'FAMILY, NOT GOVERNMENT · N.A.R.',
      note:'Let him pray for the boy. Let ministers remain ministers. These should be compatible propositions.',
      caption:'Rasputin kept close to the family but away from appointments and state papers.'
    });
  }

  if (oatrMarginaliaHas('earlyPeace1905') && qid <= 22) {
    oatrMarginaliaPatch('revolution', {
      eyebrow:'COLOR REVOLUTION · COLOR: RED · N.A.R.',
      note:'Less blood in the streets, fewer martyrs, more confidence in the palace. An easier revolution to suppress and therefore a harder reform to justify.',
      caption:'The revolutionary crisis after an early peace with Japan changes the balance of fear inside the state.'
    });
  }

  if (oatrMarginaliaScore('land') >= 10) {
    oatrMarginaliaPatch('peasants', {
      eyebrow:'THE VILLAGE HAS PROPERTY NOW · N.A.R.',
      note:'They have something to lose besides patience. Stolypin says this is the beginning of citizenship. The landlords hear something else.',
      caption:'The peasantry after land reform begins converting communal tenure into private holdings.'
    });
  }

  if (oatrMarginaliaScore('blood') >= 14) {
    oatrMarginaliaPatch('emergency', {
      eyebrow:'TEMPORARY · AGAIN · N.A.R.',
      note:'Every emergency measure arrives with an expiry date. Russia keeps the measure and misplaces the date.',
      caption:'Emergency government after repeated resort to repression and exceptional powers.'
    });
  }

  if (oatrMarginaliaHas('okhranaReformed')) {
    oatrMarginaliaPatch('okhrana', {
      eyebrow:'THE POLICE, UNDER SUPERVISION · N.A.R.',
      note:'A secret police service that must explain itself to ministers. They regard this as a radical experiment.',
      caption:'The Okhrana after tighter oversight and anti-provocation reforms.'
    });
  }
}

const oatrApplyMarginaliaBeforeContext = oatrApplyMarginalia;
oatrApplyMarginalia = function(root=document) {
  oatrContextualizeMarginalia();
  return oatrApplyMarginaliaBeforeContext(root);
};

// Refresh the currently rendered question immediately with contextual copy.
if (typeof document !== 'undefined') {
  document.querySelectorAll('.marginalia-term').forEach(node => node.replaceWith(document.createTextNode(node.querySelector('.marginalia-word')?.textContent || node.textContent || '')));
  oatrApplyMarginalia(document);
}

const OATR_MARGINALIA_DIRECT_ASSETS = {
  petrograd: 'https://mf.b37mrtl.ru/rbthmedia/images/web/in-rbth/images/2014-02/big/18/UR00-0539_468.jpg'
};

const OATR_MARGINALIA_CONTEXT_ASSETS = {
  britain: () => {
    let qid = 0;
    try { qid = typeof currentQuestion === 'function' ? (currentQuestion()?.id || 0) : 0; } catch {}
    // Before the 1907 entente: rivalry. After it: friendship conducted on top of Persia.
    const file = qid >= 20
      ? 'As Between Friends (Punch magazine, 13 December 1911).jpg'
      : 'Puck magazine, 1900 June 6.jpg';
    return oatrCommonsFile(file);
  }
};

function oatrCommonsFile(filename) {
  return `https://commons.wikimedia.org/wiki/Special:Redirect/file/${encodeURIComponent(filename)}`;
}

function oatrMarginaliaAssetUrl(id) {
  const contextual = OATR_MARGINALIA_CONTEXT_ASSETS[id];
  if (typeof contextual === 'function') return contextual();
  if (OATR_MARGINALIA_DIRECT_ASSETS[id]) return OATR_MARGINALIA_DIRECT_ASSETS[id];
  const file = OATR_MARGINALIA_ASSETS[id];
  return file ? oatrCommonsFile(file) : '';
}

function oatrInstallMarginaliaAssets() {
  if (typeof OATR_MARGINALIA === 'undefined') return;
  OATR_MARGINALIA.forEach(entry => {
    const contextual = OATR_MARGINALIA_CONTEXT_ASSETS[entry.id];
    if (typeof contextual === 'function') {
      entry.image = contextual;
      return;
    }
    const src = oatrMarginaliaAssetUrl(entry.id);
    if (src) entry.image = src;
  });

  /* marginalia.js may already have decorated the currently visible question. Refresh those
     images immediately; future questions will use the overridden entry.image automatically. */
  if (typeof document !== 'undefined' && document.querySelectorAll) {
    OATR_MARGINALIA.forEach(entry => {
      const src = oatrMarginaliaAssetUrl(entry.id);
      if (!src) return;
      document.querySelectorAll(`.marginalia-${entry.id} .marginalia-tooltip img`).forEach(img => {
        img.src = src;
      });
    });
  }
}

oatrInstallMarginaliaAssets();
if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
  window.addEventListener('DOMContentLoaded', oatrInstallMarginaliaAssets);
}
