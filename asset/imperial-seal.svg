<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Imperial seal placeholder</title>
  <desc id="desc">Temporary placeholder for the final Imperial Russian coat of arms asset.</desc>
  <defs>
    <linearGradient id="gilt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dfaa"/>
      <stop offset="0.35" stop-color="#d7b562"/>
      <stop offset="0.7" stop-color="#9d762d"/>
      <stop offset="1" stop-color="#5b3f13"/>
    </linearGradient>
  </defs>
  <rect x="18" y="18" width="284" height="284" rx="10" fill="#0d1711" stroke="url(#gilt)" stroke-width="5"/>
  <rect x="31" y="31" width="258" height="258" rx="6" fill="none" stroke="#7e6128" stroke-width="2"/>
  <text x="160" y="135" text-anchor="middle" fill="url(#gilt)" font-family="Georgia, serif" font-size="25" letter-spacing="3">IMPERIAL</text>
  <text x="160" y="174" text-anchor="middle" fill="url(#gilt)" font-family="Georgia, serif" font-size="25" letter-spacing="3">SEAL</text>
  <line x1="92" y1="198" x2="228" y2="198" stroke="#b99243" stroke-width="2"/>
  <text x="160" y="229" text-anchor="middle" fill="#9a8658" font-family="Georgia, serif" font-size="12" letter-spacing="2">PLACEHOLDER</text>
</svg>
